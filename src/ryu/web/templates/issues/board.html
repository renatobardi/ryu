{% extends "base.html" %}
{% block title %}{{ workspace.name }} — Board{% endblock %}
{% block content %}
<div class="flex flex-col h-full">
  <div class="flex items-center justify-between px-6 py-4 border-b border-zinc-800">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-semibold text-zinc-100">{{ workspace.name }}</h1>
      <span class="text-xs text-zinc-500 uppercase tracking-wide">Board</span>
      <div id="agents-working-chip" class="flex items-center gap-1.5" title="Agentes trabalhando agora"></div>
    </div>
    <form id="new-issue" hx-post="/w/{{ workspace.slug }}/board/issues"
          hx-target="#board-columns" hx-swap="outerHTML"
          class="flex items-center gap-2">
      <input name="title" id="new-issue-title" required placeholder="Nova issue..."
             class="bg-zinc-900 border border-zinc-700 rounded-md px-3 py-1.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-violet-500 w-64">
      <select name="status" class="bg-zinc-900 border border-zinc-700 rounded-md px-2 py-1.5 text-sm text-zinc-300">
        {% for st in column_order %}
        <option value="{{ st }}">{{ status_titles[st] }}</option>
        {% endfor %}
      </select>
      <select name="assignee_agent_id" class="bg-zinc-900 border border-zinc-700 rounded-md px-2 py-1.5 text-sm text-zinc-300">
        <option value="">Sem agente</option>
        {% for a in agents %}
        <option value="{{ a.id }}">@{{ a.handle }}</option>
        {% endfor %}
      </select>
      <button type="submit"
              class="bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium rounded-md px-3 py-1.5">
        Criar
      </button>
    </form>
  </div>

  {% include "issues/_board_columns.html" %}
</div>

<script>
  // drag-and-drop nativo: no drop calcula vizinhos e faz hx-post via htmx.ajax
  document.addEventListener("dragstart", (e) => {
    const card = e.target.closest("[data-issue-id]");
    if (card) e.dataTransfer.setData("text/issue-id", card.dataset.issueId);
  });
  document.addEventListener("dragover", (e) => {
    if (e.target.closest("[data-column-status]")) e.preventDefault();
  });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest("[data-column-status]");
    const issueId = e.dataTransfer && e.dataTransfer.getData("text/issue-id");
    if (!col || !issueId) return;
    e.preventDefault();
    const cards = Array.from(col.querySelectorAll("[data-issue-id]")).filter(c => c.dataset.issueId !== issueId);
    let beforeId = "", afterId = "";
    const target = e.target.closest("[data-issue-id]");
    if (target && target.dataset.issueId !== issueId) {
      const idx = cards.indexOf(target);
      beforeId = target.dataset.issueId;              // card abaixo do destino
      if (idx > 0) afterId = cards[idx - 1].dataset.issueId; // card acima
    } else if (cards.length) {
      afterId = cards[cards.length - 1].dataset.issueId;     // fim da coluna
    }
    htmx.ajax("POST", `/w/{{ workspace.slug }}/board/move`, {
      target: "#board-columns", swap: "outerHTML",
      values: { issue_id: issueId, status: col.dataset.columnStatus, before_id: beforeId, after_id: afterId },
    });
  });

  // Chip "agents working": backing GET /api/dashboard/working-agents
  // (presença em tempo real, paridade multica ListWorkspaceWorkingAgents).
  // Clicar num chip filtra o board pelo assignee-id do agente; clicar de novo
  // limpa o filtro. Poll simples (sem WS) — consistente com o hub HTTP-only
  // já usado no resto do Ryu.
  (function () {
    const chipContainer = document.getElementById("agents-working-chip");
    let activeAgentId = null;

    function applyFilter() {
      document.querySelectorAll("[data-issue-id]").forEach((card) => {
        const show = !activeAgentId || card.dataset.assigneeId === activeAgentId;
        card.classList.toggle("hidden", !show);
      });
    }

    async function refreshWorkingAgents() {
      let agents = [];
      try {
        const res = await fetch(`/api/dashboard/working-agents?workspace_id={{ workspace.id }}&type=issue`);
        if (res.ok) agents = await res.json();
      } catch (e) {
        return; // best-effort: sem rede, mantém o chip como estava
      }
      chipContainer.innerHTML = "";
      if (!agents.length) {
        if (activeAgentId) { activeAgentId = null; applyFilter(); }
        return;
      }
      if (activeAgentId && !agents.some((a) => a.id === activeAgentId)) {
        activeAgentId = null;
        applyFilter();
      }
      agents.forEach((a) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.dataset.agentId = a.id;
        chip.className = "text-[11px] px-2 py-0.5 rounded-full border transition-colors " +
          (a.id === activeAgentId
            ? "bg-violet-600 border-violet-500 text-white"
            : "bg-emerald-500/10 border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/20");
        chip.textContent = `${a.name} (${a.running_task_count})`;
        chip.addEventListener("click", () => {
          activeAgentId = activeAgentId === a.id ? null : a.id;
          refreshWorkingAgents();
          applyFilter();
        });
        chipContainer.appendChild(chip);
      });
    }

    refreshWorkingAgents();
    setInterval(refreshWorkingAgents, 10000);
  })();
</script>
{% endblock %}
