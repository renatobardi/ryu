<div id="attachments" class="space-y-1">
  {% for a in attachments %}
  <div class="flex items-center gap-2 text-sm bg-surface-sunken border border-border-default rounded-md px-3 py-1.5">
    <span class="text-xs text-text-muted">
      <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
    </span>
    <a href="{{ a.download_url }}" class="text-text-secondary hover:text-text-accent truncate flex-1">{{ a.filename }}</a>
    <span class="text-2xs text-text-faint">{{ (a.size_bytes / 1024) | round(1) }} KB</span>
  </div>
  {% else %}
  <p class="text-sm text-text-faint">Nenhum anexo.</p>
  {% endfor %}
</div>
