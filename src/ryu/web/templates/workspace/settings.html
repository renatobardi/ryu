{% extends "base.html" %}
{% block title %}Settings — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="px-6 py-4 border-b border-border-soft">
  <h1 class="text-lg font-semibold text-text-primary">Settings</h1>
</div>

<div class="px-6 py-6 space-y-8 max-w-2xl">
  <!-- Workspace -->
  <section>
    <h2 class="text-sm font-medium text-text-secondary mb-3">Workspace</h2>
    {% if saved %}
    <p class="text-xs text-emerald-400 mb-2">Alterações salvas.</p>
    {% endif %}
    <form method="post" action="/w/{{ workspace.slug }}/settings" class="space-y-3 bg-surface-card border border-border-default rounded-lg p-4">
      <div>
        <label class="block text-xs text-text-subtle mb-1">Nome do workspace</label>
        <input name="name" value="{{ workspace.name }}" required
               class="bg-surface-input border border-border-strong rounded-md px-3 py-1.5 text-sm w-full focus:outline-none focus:border-border-focus">
      </div>
      <div>
        <label class="block text-xs text-text-subtle mb-1">Issue prefix</label>
        <input name="issue_prefix" value="{{ workspace.issue_prefix }}" required maxlength="10"
               class="bg-surface-input border border-border-strong rounded-md px-3 py-1.5 text-sm w-32 font-mono uppercase focus:outline-none focus:border-border-focus">
      </div>
      <button class="bg-accent hover:bg-accent-hover text-text-on-accent text-sm px-4 py-1.5 rounded-md">Salvar</button>
    </form>
  </section>

  <!-- PATs -->
  <section>
    <h2 class="text-sm font-medium text-text-secondary mb-3">Personal Access Tokens (ryu_)</h2>
    <div class="bg-surface-card border border-border-default rounded-lg p-4 space-y-3">
      <div class="flex gap-2">
        <input id="pat-name" placeholder="Nome do token (ex.: cli local)"
               class="bg-surface-input border border-border-strong rounded-md px-3 py-1.5 text-sm flex-1 focus:outline-none focus:border-border-focus">
        <button onclick="createPat()" class="bg-accent hover:bg-accent-hover text-text-on-accent text-sm px-4 py-1.5 rounded-md">Criar token</button>
      </div>
      <div id="pat-new" class="hidden text-xs bg-surface-sunken border border-emerald-600/30 rounded-md p-3 font-mono break-all text-emerald-400"></div>
      <ul id="pat-list" class="divide-y divide-border-hairline text-sm"></ul>
    </div>
  </section>

  <!-- Sessão -->
  <section>
    <h2 class="text-sm font-medium text-text-secondary mb-3">Sessão</h2>
    <button onclick="ryuLogout()" class="bg-surface-sunken hover:bg-surface-active text-text-body text-sm px-4 py-1.5 rounded-md">Sair (logout)</button>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadPats() {
  const r = await fetch('/api/auth/tokens');
  if (!r.ok) return;
  const items = await r.json();
  const ul = document.getElementById('pat-list');
  ul.innerHTML = '';
  if (items.length === 0) {
    ul.innerHTML = '<li class="py-2 text-text-subtle text-xs">Nenhum token ativo.</li>';
    return;
  }
  for (const t of items) {
    const li = document.createElement('li');
    li.className = 'py-2 flex items-center justify-between';
    li.innerHTML = `<span class="text-text-secondary">${t.name || '(sem nome)'} <span class="text-xs text-text-subtle">${(t.created_at || '').slice(0, 10)}</span></span>`;
    const btn = document.createElement('button');
    btn.textContent = 'Revogar';
    btn.className = 'text-xs text-red-400 hover:text-red-300';
    btn.onclick = async () => {
      await fetch(`/api/auth/tokens/${t.id}`, {method: 'DELETE'});
      loadPats();
    };
    li.appendChild(btn);
    ul.appendChild(li);
  }
}
async function createPat() {
  const name = document.getElementById('pat-name').value || '';
  const r = await fetch('/api/auth/tokens', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name}),
  });
  if (!r.ok) return;
  const d = await r.json();
  const box = document.getElementById('pat-new');
  box.textContent = 'Copie agora (exibido uma única vez): ' + d.token;
  box.classList.remove('hidden');
  document.getElementById('pat-name').value = '';
  loadPats();
}
loadPats();
</script>
{% endblock %}
