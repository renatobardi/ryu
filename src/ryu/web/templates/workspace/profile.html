{% extends "base.html" %}
{% block title %}Profile — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="px-6 py-4 border-b border-border-soft">
  <h1 class="text-lg font-semibold text-text-primary">Profile</h1>
</div>

<div class="px-6 py-6 space-y-8 max-w-2xl">
  <!-- Conta -->
  <section>
    <h2 class="text-sm font-medium text-text-secondary mb-3">Conta</h2>
    {% if saved %}
    <p class="text-xs text-success-fg mb-2">Alterações salvas.</p>
    {% endif %}
    <form method="post" action="/w/{{ workspace.slug }}/profile" class="space-y-3 bg-surface-card border border-border-default rounded-lg p-4">
      <div>
        <span class="block text-xs text-text-subtle mb-1">E-mail</span>
        <span class="text-sm text-text-body">{{ user.email }}</span>
      </div>
      <div>
        <label for="profile-name" class="block text-xs text-text-subtle mb-1">Nome</label>
        <input id="profile-name" name="name" value="{{ user.name }}" required
               class="bg-surface-input border border-border-strong rounded-md px-3 py-1.5 text-sm w-full focus:outline-none focus:border-border-focus">
      </div>
      <button class="bg-accent hover:bg-accent-hover text-text-on-accent text-sm px-4 py-1.5 rounded-md">Salvar</button>
    </form>
  </section>

  <!-- Sessão -->
  <section>
    <h2 class="text-sm font-medium text-text-secondary mb-3">Sessão</h2>
    <button onclick="ryuLogout()" class="bg-surface-sunken hover:bg-surface-active text-text-body text-sm px-4 py-1.5 rounded-md">Sair (logout)</button>
  </section>
</div>
{% endblock %}
