{% if pins %}
<div class="px-3 pt-3 pb-1 text-2xs uppercase tracking-wider text-text-faint">Pinned</div>
{% for p in pins %}
{% if p.item %}
<a href="{% if p.item_type == 'issue' %}/w/{{ workspace.slug }}/issues/{{ p.item.key }}{% else %}/w/{{ workspace.slug }}/projects{% endif %}"
   class="flex items-center gap-2.5 px-3 py-1.5 rounded-md text-sm text-text-muted hover:bg-surface-hover hover:text-text-body transition-colors duration-120">
  <span class="w-4 h-4 flex items-center justify-center opacity-[0.85] shrink-0">
    <i data-lucide="pin" class="w-4 h-4" stroke-width="1.75"></i>
  </span>
  <span class="flex-1 truncate">
    {% if p.item_type == 'issue' %}{{ p.item.key }} · {{ p.item.title }}{% else %}{{ p.item.name }}{% endif %}
  </span>
</a>
{% endif %}
{% endfor %}
{% endif %}
