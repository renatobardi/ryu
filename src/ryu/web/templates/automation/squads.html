{% extends "base.html" %}
{% block title %}Squads — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-xl font-semibold text-zinc-100 mb-4">Squads</h1>

  <form hx-post="/w/{{ workspace.slug }}/squads" hx-target="#squads-list" hx-swap="outerHTML"
        class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 mb-6 grid grid-cols-3 gap-3">
    <input name="name" required placeholder="Nome da squad"
           class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-100" />
    <select name="leader_agent_id" required class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-300">
      {% for a in agents %}<option value="{{ a.id }}">líder: {{ a.name }}</option>{% endfor %}
    </select>
    <button type="submit" class="bg-violet-600 hover:bg-violet-500 text-white text-sm px-4 py-2 rounded">
      Criar squad
    </button>
  </form>

  {% include "automation/_squads_list.html" %}
</div>
{% endblock %}
