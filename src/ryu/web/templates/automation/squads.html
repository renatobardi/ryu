{% extends "base.html" %}
{% block title %}Squads — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-xl font-semibold text-text-primary mb-4">Squads</h1>

  <form hx-post="/w/{{ workspace.slug }}/squads" hx-target="#squads-list" hx-swap="outerHTML"
        class="bg-surface-card border border-border-default rounded-lg p-4 mb-6 space-y-3">
    <div class="grid grid-cols-3 gap-3">
      <input name="name" required placeholder="Nome da squad"
             class="bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary" />
      <select name="leader_agent_id" required class="bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-secondary">
        {% for a in agents %}<option value="{{ a.id }}">líder: {{ a.name }}</option>{% endfor %}
      </select>
      <button type="submit" class="bg-accent hover:bg-accent-hover text-text-on-accent text-sm px-4 py-2 rounded">
        Criar squad
      </button>
    </div>
    <input name="description" placeholder="Descrição (o que a squad faz)" aria-label="Descrição da squad"
           class="w-full bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary" />
    <textarea name="instructions" rows="2" aria-label="Instruções operacionais do líder"
              placeholder="Instruções operacionais do líder (injetadas em todo briefing)"
              class="w-full bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary"></textarea>
  </form>

  {% include "automation/_squads_list.html" %}
</div>
{% endblock %}
