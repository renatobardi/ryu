{% extends "base.html" %}
{% block title %}Skills — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-xl font-semibold text-zinc-100 mb-4">Skills</h1>

  <form hx-post="/w/{{ workspace.slug }}/skills" hx-target="#skills-list" hx-swap="outerHTML"
        class="bg-zinc-900 border border-zinc-800 rounded-lg p-4 mb-6 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <input name="name" required placeholder="Nome da skill"
             class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-100" />
      <input name="description" placeholder="Descrição curta"
             class="bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-100" />
    </div>
    <textarea name="content" rows="4" placeholder="Conteúdo em markdown…"
              class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-100 font-mono"></textarea>
    <button type="submit" class="bg-violet-600 hover:bg-violet-500 text-white text-sm px-4 py-2 rounded">
      Criar skill
    </button>
  </form>

  {% include "automation/_skills_list.html" %}
</div>
{% endblock %}
