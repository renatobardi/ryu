{% extends "base.html" %}
{% block title %}Skills — {{ workspace.name }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-xl font-semibold text-text-primary mb-4">Skills</h1>

  <form hx-post="/w/{{ workspace.slug }}/skills" hx-target="#skills-list" hx-swap="outerHTML"
        class="bg-surface-card border border-border-default rounded-lg p-4 mb-6 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <input name="name" required placeholder="Nome da skill"
             class="bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary" />
      <input name="description" placeholder="Descrição curta"
             class="bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary" />
    </div>
    <textarea name="content" rows="4" placeholder="Conteúdo em markdown…"
              class="w-full bg-surface-input border border-border-strong rounded px-3 py-2 text-sm text-text-primary font-mono"></textarea>
    <button type="submit" class="bg-accent hover:bg-accent-hover text-text-on-accent text-sm px-4 py-2 rounded">
      Criar skill
    </button>
  </form>

  {% include "automation/_skills_list.html" %}
</div>
{% endblock %}
