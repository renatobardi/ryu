name: Release

on:
  push:
    # Todo merge na main publica uma imagem, subindo o último número da versão.
    branches:
      - main
    # Uma tag v* criada à mão continua funcionando como antes.
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a publicar (ex.: v0.2.0 ou latest)"
        required: true
        default: "latest"

# Serializa as publicações. Sem isso, dois merges próximos calculam a mesma
# versão e o segundo falha ao criar a tag; enfileirados, o segundo recalcula
# depois do primeiro e segue o contador.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # write porque o job cria a tag da release. Tag criada com o GITHUB_TOKEN não
  # re-dispara workflow — o GitHub bloqueia recursão —, então não há loop.
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # As tags precisam vir junto para calcular a próxima versão.
          fetch-depth: 0

      - name: Determine image tag
        id: meta
        run: |
          set -euo pipefail
          create_tag=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            # Merge na main: sobe o último número da última versão publicada
            # (v0.4.7 -> v0.4.8). Os dois primeiros só mudam por tag manual.
            #
            # O filtro é ancorado de propósito: um `git tag -l 'v*.*.*'` também
            # casaria v1.2.3-rc1 e v0.4.7.1, e daí sairia um "patch" como
            # "3-rc1" que aborta a aritmética, ou um número que anda pra trás.
            versions="$(git tag -l --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' || true)"
            latest="${versions%%$'\n'*}"
            if [ -z "$latest" ]; then
              echo "Nenhuma tag de versão no repositório — crie a primeira à mão." >&2
              exit 1
            fi
            numbers="${latest#v}"
            major="${numbers%%.*}"
            minor="${numbers#*.}"
            minor="${minor%%.*}"
            patch="${numbers##*.}"
            tag="v${major}.${minor}.$((patch + 1))"
            create_tag=true
            echo "última versão: $latest -> nova: $tag"
          fi
          echo "tag=${tag:-latest}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      # Depois do build, de propósito: se o build falhar, a versão não é
      # consumida e o próximo merge tenta o mesmo número, em vez de deixar
      # uma tag apontando para um commit sem imagem.
      - name: Create release tag
        if: steps.meta.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Ryu $TAG"
          git push origin "$TAG"
