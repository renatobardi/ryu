</head><body><div id="root"></div><script type="text/babel">const { StatusDot, StatusPill, PriorityTag, CountBadge, IssueKey, DataTable } = window.RyuDesignSystem_7ed69e;
const S=['backlog','todo','in_progress','in_review','done','blocked','cancelled'];
function Demo(){return (<div className="col" style={{gap:14}}>
  <div className="row" style={{gap:14}}>{S.map(s=>(<span key={s} className="row" style={{gap:6,fontSize:12,color:'var(--text-muted)'}}><StatusDot status={s}/>{s}</span>))}</div>
  <div className="row">{['idle','working','blocked','error','offline'].map(s=><StatusPill key={s} kind="agent" status={s}/>)}</div>
  <div className="row">{['queued','dispatched','running','completed','failed','cancelled'].map(s=><StatusPill key={s} kind="task" status={s}/>)}</div>
  <div className="row">
    {['urgent','high','medium','low'].map(p=><PriorityTag key={p} priority={p}/>)}
    <StatusPill kind="severity" status="action_required">action required</StatusPill>
    <StatusPill kind="state" status="on">ativo</StatusPill>
    <StatusPill kind="state" status="off">pausado</StatusPill>
    <CountBadge count={3}/><IssueKey>RYU-142</IssueKey>
  </div>
  <DataTable columns={[{key:'a',label:'Agente'},{key:'k',label:'Tipo',muted:true},{key:'s',label:'Status'},{key:'d',label:'Criada',align:'right',small:true,muted:true}]}
    rows={[{a:'Codebot',k:'issue_work',s:<StatusPill kind="task" status="running"/>,d:'24/07 09:12'},
           {a:'Reviewer',k:'review',s:<StatusPill kind="task" status="completed"/>,d:'24/07 08:40'}]} />
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script></body></html>
