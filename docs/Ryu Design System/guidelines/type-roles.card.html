<!-- @dsCard group="Type" viewport="700x180" name="Papéis de texto" subtitle="Hierarquia por cor, não por tamanho" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans);padding:16px}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--violet-300)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}code{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="col" style="gap:9;font-size:14px">
<div class="row"><span style="color:var(--text-primary);width:280px">zinc-100 — títulos e valores</span><code>--text-primary</code></div>
<div class="row"><span style="color:var(--text-body);width:280px">zinc-200 — corpo do body</span><code>--text-body</code></div>
<div class="row"><span style="color:var(--text-secondary);width:280px">zinc-300 — texto de select, labels de coluna</span><code>--text-secondary</code></div>
<div class="row"><span style="color:var(--text-muted);width:280px">zinc-400 — descrições, nav inativo</span><code>--text-muted</code></div>
<div class="row"><span style="color:var(--text-subtle);width:280px">zinc-500 — metadados, placeholders</span><code>--text-subtle</code></div>
<div class="row"><span style="color:var(--text-faint);width:280px">zinc-600 — timestamps, labels de seção</span><code>--text-faint</code></div>
</div></body></html>
