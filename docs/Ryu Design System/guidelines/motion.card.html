<!-- @dsCard group="Spacing" viewport="700x150" name="Movimento e estados" subtitle="120ms de fade nos swaps, opacidade 0.6 em request, pulse no typing" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans);padding:16px}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--violet-300)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}code{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="col" style="gap:10;font-size:12px;color:var(--text-muted)">
<div class="row"><span style="width:210px">swap do HTMX</span><code>opacity 0 → 1 · 120ms ease-out</code></div>
<div class="row"><span style="width:210px">requisição em voo</span><span style="opacity:.6;color:var(--text-primary)">opacity .6 + pointer-events none</span></div>
<div class="row"><span style="width:210px">agente digitando</span><span style="background:var(--neutral-800);color:var(--neutral-500);border-radius:12px;padding:6px 12px;animation:var(--animate-pulse)">agente digitando…</span></div>
<div class="row"><span style="width:210px">hover / foco</span><span>só troca de cor — nenhum transform, scale ou bounce</span></div>
</div></body></html>
