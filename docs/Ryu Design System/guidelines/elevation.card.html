<!-- @dsCard group="Spacing" viewport="700x160" name="Profundidade" subtitle="Zero box-shadow: separação é borda de 1px + troca de superfície" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans);padding:16px}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--violet-300)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}code{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="row" style="gap:12;align-items:stretch">
<div style="flex:1;background:var(--ryu-base);border:1px solid var(--border-default);border-radius:8px;padding:12px"><div class="lbl">base</div><div style="margin-top:8px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;padding:12px;font-size:12px;color:var(--text-muted)">panel sobre base</div></div>
<div style="flex:1;background:var(--surface-column);border:1px solid var(--border-default);border-radius:8px;padding:12px"><div class="lbl">coluna zinc-900/60</div><div style="margin-top:8px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:6px;padding:12px;font-size:12px;color:var(--text-muted)">card zinc-900</div></div>
<div style="flex:1;border:1px dashed var(--border-default);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-subtle);text-align:center">borda tracejada = estado vazio</div>
</div></body></html>
