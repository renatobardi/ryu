<!-- @dsCard group="Colors" viewport="700x160" name="Semânticas translúcidas" subtitle="Toda pill é fundo com 15–35% de alpha + texto na versão clara" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans);padding:16px}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--violet-300)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}</style>
</head><body><div class="col" style="gap:10">
  <div class="row"><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--agent-idle-bg);color:var(--agent-idle-fg)">idle</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--agent-working-bg);color:var(--agent-working-fg)">working</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--agent-blocked-bg);color:var(--agent-blocked-fg)">blocked</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--agent-error-bg);color:var(--agent-error-fg)">error</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--agent-offline-bg);color:var(--agent-offline-fg)">offline</span><span class="lbl">agent</span></div>
  <div class="row"><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-queued-bg);color:var(--task-queued-fg)">queued</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-dispatched-bg);color:var(--task-dispatched-fg)">dispatched</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-running-bg);color:var(--task-running-fg)">running</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-completed-bg);color:var(--task-completed-fg)">completed</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-failed-bg);color:var(--task-failed-fg)">failed</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--task-cancelled-bg);color:var(--task-cancelled-fg)">cancelled</span><span class="lbl">task</span></div>
  <div class="row"><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--sev-action-required-bg);color:var(--sev-action-required-fg)">action required</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--sev-attention-bg);color:var(--sev-attention-fg)">attention</span><span style="font-size:10px;font-weight:500;border-radius:99px;padding:2px 8px;background:var(--sev-info-bg);color:var(--sev-info-fg)">info</span><span class="lbl">inbox</span></div>
  <div class="row"><span style="font-size:10px;font-weight:500;border-radius:4px;padding:2px 6px;background:var(--prio-urgent-bg);color:var(--prio-urgent-fg)">URGENT</span><span style="font-size:10px;font-weight:500;border-radius:4px;padding:2px 6px;background:var(--prio-high-bg);color:var(--prio-high-fg)">HIGH</span><span style="font-size:10px;font-weight:500;border-radius:4px;padding:2px 6px;background:var(--prio-medium-bg);color:var(--prio-medium-fg)">MEDIUM</span><span style="font-size:10px;font-weight:500;border-radius:4px;padding:2px 6px;background:var(--prio-low-bg);color:var(--prio-low-fg)">LOW</span><span class="lbl">prioridade · raio 4px</span></div>
</div></body></html>
