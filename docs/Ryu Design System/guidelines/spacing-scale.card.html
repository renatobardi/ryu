<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-sans);padding:16px}a{color:var(--text-accent);text-decoration:none}a:hover{color:var(--violet-300)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}code{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="row" style="gap:10;align-items:flex-end"><div style="text-align:center"><div style="width:2px;height:2px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">2</code></div><div style="text-align:center"><div style="width:4px;height:4px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">4</code></div><div style="text-align:center"><div style="width:6px;height:6px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">6</code></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">8</code></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">12</code></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">16</code></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">20</code></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">24</code></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">32</code></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--violet-500);border-radius:2px"></div><code style="display:block;margin-top:6px">48</code></div></div>
<div style="margin-top:12px;font-size:11px;color:var(--text-faint)">Controles: 6px vertical / 12px horizontal. Cards: 16px. Páginas: 24px.</div></body></html>
