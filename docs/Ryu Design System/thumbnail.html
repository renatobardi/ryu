<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}body{display:flex;font-family:var(--font-sans)}
.main{width:75%;height:100%;background:var(--ryu-base);display:flex;align-items:center;justify-content:center}
.mark{font-size:300px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1}
.strip{width:25%;height:100%;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><div class="mark">Ryu</div></div>
<div class="strip"><div style="background:var(--violet-400)"></div><div style="background:var(--green-500)"></div><div style="background:var(--yellow-500)"></div><div style="background:var(--violet-600)"></div></div>
</body></html>
