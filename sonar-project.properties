# docs/Ryu Design System/ é um pacote gerado por ferramenta externa, versionado
# como referência de design — não é importado pelo app (não há bundler) e não
# roda em produção. Analisá-lo mede a ferramenta que o produziu, não este
# código: previews HTML sem <title>, eval/postMessage no runtime da ferramenta,
# e templates/ryu-app + ui_kits/ryu-app, que são cópias byte a byte.
sonar.exclusions=docs/Ryu Design System/**
